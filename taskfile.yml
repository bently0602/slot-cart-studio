version: '3'

vars:
  SLOT: ../slot-b
  # What the studio's faces are made of: the four files compiled in place, slot's art.rs that
  # src/art.rs copies, the assets they include, where `Cart` comes from, gba.rs, whose header
  # rule src/rom.rs mirrors, gb.rs, whose header the shim answers for, and ini.rs and
  # cart_shell.rs, which the shell choice is read and merged through.
  FACE_PATHS: >-
    crates/slot-ui/src/cart.rs crates/slot-ui/src/shell.rs crates/slot-ui/src/silhouette.rs
    crates/slot-ui/src/text.rs crates/slot-ui/src/art.rs crates/slot-ui/assets/cart.svg
    crates/slot-ui/assets/cart_detail.svg crates/slot-ui/assets/gb_cart.svg
    crates/slot-ui/assets/gb_cart_detail.svg crates/slot-ui/assets/gbc_cart.svg
    crates/slot-ui/assets/gbc_cart_detail.svg crates/slot-ui/assets/lettering_gb.png
    crates/slot-ui/assets/lettering_gbc.png crates/slot-ui/assets/lettering_gba.png
    crates/slot-ui/assets/label.ttf crates/slot-store/src/scan.rs crates/slot-store/src/gba.rs
    crates/slot-store/src/gb.rs crates/slot-store/src/ini.rs crates/slot-store/src/cart_shell.rs
    crates/slot-store/src/platform.rs crates/slot-store/src/core.rs crates/slot-store/src/music.rs

tasks:
  default:
    silent: true
    cmds:
      - task --list

  test:
    desc: Native tests, the faces against slot's included
    cmds:
      - cargo test
      - npm test
      - python3 -m unittest discover -s tools -p 'test_*.py'

  check:
    desc: Formatting, clippy for both targets, and the tests
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - cargo test
      - npm test
      - python3 -m unittest discover -s tools -p 'test_*.py'

  slot:pin-check:
    desc: Say whether ../slot's cart face still matches the commit in slot.ref
    cmds:
      - |
        set -eu
        pin="$(cat slot.ref)"
        # Against the working tree, not HEAD: a local build compiles whatever ../slot has on disk.
        if git -C {{.SLOT}} diff --quiet "$pin" -- {{.FACE_PATHS}}; then
          echo "../slot's cart face matches slot.ref ($pin)"
        else
          echo "../slot's cart face has changed since slot.ref ($pin):"
          git -C {{.SLOT}} diff --stat "$pin" -- {{.FACE_PATHS}}
          exit 1
        fi

  build:
    desc: Build the WASM package into web/pkg
    cmds:
      - npm ci
      - npm run build
      - wasm-pack build --release --target web --no-typescript --no-pack --out-dir web/pkg

  browser:
    desc: Check SNES and music workflows in headless Chromium
    deps: [build]
    cmds:
      - npm run test:browser

  serve:
    desc: Serve web/ at http://127.0.0.1:8765
    deps: [build]
    cmds:
      - python3 -m http.server 8765 --bind 127.0.0.1 --directory web

  desktop:
    desc: Cross-build the studio as one file for Windows x64 and macOS arm64 into dist/
    cmds:
      - ./build-desktop.sh

  desktop:check:
    desc: Formatting, server lookup tests and Clippy for the desktop app
    deps: [build]
    cmds:
      - cargo fmt --manifest-path desktop/Cargo.toml --check
      - cargo test --manifest-path desktop/Cargo.toml
      - cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

  art:
    desc: 'Serve a harvested set at :8766, for http://127.0.0.1:8765/?art=http://127.0.0.1:8766/'
    cmds:
      - python3 tools/serve-art.py {{.ART | default "~/CartStudioArt"}} 8766

  verify:
    desc: Open ../slot/sdcard in headless Chrome, screenshot the studio and download its zip into out/
    deps: [build]
    cmds:
      - python3 tools/verify.py

  sheet:
    desc: After task verify, render out/sheet.png with generated labels on the left and slot's hand-made ones on the right
    cmds:
      - cargo run --example sheet -- out/card {{.SLOT}}/sdcard out/sheet.png
