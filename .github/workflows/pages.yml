name: pages

# The page is static, but its WASM is built from this crate and from four of slot's own source
# files, which is why slot is checked out beside it at the commit slot.ref names.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancelling one on its way out. A cancelled deploy-pages leaves
# the site on whatever half of the artifact made it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: studio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: slot-cart-studio

      - id: pin
        run: echo "ref=$(cat slot-cart-studio/slot.ref)" >> "$GITHUB_OUTPUT"

      # Beside the studio, as the two sit on a desk, so ../slot-b means the same thing here. The
      # fork, because it is the slot with PlayStation in it.
      - uses: actions/checkout@v7
        with:
          repository: bently0602/slot
          ref: ${{ steps.pin.outputs.ref }}
          path: slot-b

      # The channel rust-toolchain.toml pins, with the target it names.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build HorizonJS frontend and music parser
        working-directory: slot-cart-studio
        run: npm ci && npm run build

      - name: Rust with the wasm32 target
        run: rustup toolchain install 1.96 --profile minimal --target wasm32-unknown-unknown

      - name: wasm-pack 0.15.0
        run: |
          set -eu
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build
        working-directory: slot-cart-studio
        run: wasm-pack build --release --target web --no-typescript --no-pack --out-dir web/pkg

      - name: Verify studio and lookup service
        working-directory: slot-cart-studio
        run: |
          set -eu
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
          cargo test
          cargo fmt --manifest-path desktop/Cargo.toml --check
          cargo test --manifest-path desktop/Cargo.toml
          cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
          npm test
          python3 -m pip install Pillow numpy
          python3 -m unittest discover -s tools -p 'test_*.py'
          npx playwright install --with-deps chromium
          npm run test:browser
          npx wrangler deploy --dry-run --outdir out/worker

      - name: Stamp the commit into the footer
        working-directory: slot-cart-studio
        run: |
          set -eu
          sed -i "s/^const BUILD = 'dev';\$/const BUILD = '$GITHUB_SHA';/" web/studio.js
          grep -q "^const BUILD = '$GITHUB_SHA';\$" web/studio.js

      - uses: actions/configure-pages@v5

      - name: Verify release services are ready
        run: |
          set -eu
          curl -fsS 'https://studio.slot-cfw.fyi/api/music/search?artist=Daft%20Punk&album=Discovery' \
            | jq -e '.candidates | type == "array"'
          curl -fsS 'https://art.slot-cfw.fyi/index.json' | jq -e '
            ([.[] | .wheel? // empty | select(startswith("SNES/"))] | length > 0) and
            ([.[] | .["support-texture"]? // empty | select(startswith("SNES/"))] | length > 0)'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slot-cart-studio/web

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare's cache for the studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -eu
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"$(cat slot-cart-studio/CNAME)\"]}" \
            | jq -e '.success'
