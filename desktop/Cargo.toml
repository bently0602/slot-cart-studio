[package]
name = "slot-cart-studio-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[[bin]]
name = "cart-studio"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
serde_json = "1.0"
form_urlencoded = "1.2"
httpdate = "1.0"
unicode-normalization = "0.1"
percent-encoding = "2.3"
sha2 = "0.10"
sha1 = "0.10"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
# rustc strips Mach-O with the host's `strip`, which a Linux host does not have.
strip = "none"
